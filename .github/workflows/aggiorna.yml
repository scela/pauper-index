# Pauper Index: aggiornamento giornaliero dei dati, revisioni, allarmi e pubblicazione su GitHub Pages.
# Un solo workflow con più job. Actions fissate per SHA (aggiornate da Dependabot); nessun segreto oltre a GITHUB_TOKEN.
name: Aggiorna e pubblica

on:
  schedule:
    - cron: '23 7 * * *'   # ogni giorno alle 07:23 UTC (la fonte pubblica di solito nella notte europea)
  workflow_dispatch:
    inputs:
      forza_revisione:
        description: 'Codice Scryfall del set da rivedere subito (per esempio hob). Vuoto: nessuna.'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['web/**', 'data/**', 'pipeline/**', '.github/workflows/**']
  pull_request:   # Pull Request (anche di Dependabot): solo i test, nessuna pubblicazione
    branches: [main]

permissions: {}

concurrency:
  group: pauper-index-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  FORCE_COLOR: '0'

jobs:
  test:
    name: Test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - name: 'Pipeline: dipendenze, test e lint'
        run: |
          pip install -r pipeline/requirements-lock.txt -e pipeline
          python -m pytest pipeline -q
          ruff check pipeline
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 'Sito: test, build e smoke test'
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

  update:
    name: Aggiorna i dati
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write   # commit dei dati
      issues: write     # revisioni e allarmi
      actions: write    # riattivazione del workflow (keepalive)
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FORZA_REVISIONE: ${{ inputs.forza_revisione }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - name: Dipendenze
        run: pip install -r pipeline/requirements-lock.txt -e pipeline
      - name: Cache del clone della fonte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/source
          key: source-${{ github.run_id }}
          restore-keys: source-
      - name: Cache dello stato dei nomi italiani
        # copia grezza dei dati di Scryfall: non va nel repository (data/reviews/italiano.json è in .gitignore).
        # Se la cache manca (scaduta o prima esecuzione), build riscarica tutto: circa 3 minuti.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/reviews/italiano.json
          key: italiano-${{ github.run_id }}
          restore-keys: italiano-
      - name: Cache delle versioni controllate dei simboli delle espansioni
        # versioni (?ts) di Scryfall già scaricate con il disegno invariato: senza, le icone si riscaricano a ogni build.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/seticons-checked.json
          key: seticons-${{ github.run_id }}
          restore-keys: seticons-
      - name: Ricostruisci i dati (fonte + Scryfall)
        run: python -m pauper_index build > .cache-build.log && tail -n 60 .cache-build.log
      - name: Revisioni dopo le espansioni
        run: |
          if [ -n "$FORZA_REVISIONE" ]; then
            if ! printf '%s' "$FORZA_REVISIONE" | grep -Eq '^[a-z0-9]{2,6}$'; then
              echo "::error::codice del set non valido: usa lettere minuscole e cifre, per esempio hob"; exit 1
            fi
            python -m pauper_index review --force "$FORZA_REVISIONE"
          else
            python -m pauper_index review
          fi
      - name: Allarme fonte ferma
        run: python -m pauper_index alarm
      - name: Commit dei dati (solo se qualcosa è cambiato)
        run: |
          rm -f .cache-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python -m pauper_index changed; then
            git add data
            git commit -m "Dati: aggiornamento del $(date -u +%F)"
            git push
          fi
      - name: Issue per revisioni e allarmi
        run: |
          shopt -s nullglob
          for f in .cache/issues/*.md; do
            title=$(head -n 1 "$f")
            tail -n +2 "$f" > body.md
            if [ "$title" = "Fonte dati ferma" ] && \
               [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
              echo "Issue \"$title\" già aperta"; continue
            fi
            gh issue create --title "$title" --body-file body.md --assignee "${{ github.repository_owner }}"
          done
      - name: Keepalive (il workflow programmato non deve spegnersi da solo)
        run: |
          # 1) riattiva il workflow: azzera il conteggio dei 60 giorni di inattività dei repository pubblici
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/aggiorna.yml/enable"
          # 2) se non ci sono commit da 45 giorni (fonte ferma, dati invariati), registra comunque un'attività
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            date -u +%F > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m "Keepalive del $(date -u +%F)"
            git push
          fi

  deploy:
    name: Pubblica su GitHub Pages
    needs: [test, update]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.test.result == 'success' || needs.update.result == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read     # esito dei test dell'ultimo commit di codice
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main   # include il commit dei dati appena fatto dal job update
          fetch-depth: 0      # storia completa (senza contenuti) per trovare l'ultimo commit di codice
          filter: blob:none
      - name: Solo con i test verdi (esecuzioni programmate e manuali)
        # il job update non esegue i test: senza questo controllo un main rosso andrebbe online la mattina dopo.
        # Si pubblica solo se il job Test del push dell'ultimo commit che tocca il codice è riuscito; altrimenti il
        # deploy fallisce, online resta la versione precedente e il job notify apre una Issue.
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git log -1 --format=%H -- web pipeline .github/workflows)
          runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&event=push&per_page=20" --jq '.workflow_runs[] | select(.path == ".github/workflows/aggiorna.yml") | .id')
          ok=""
          for id in $runs; do
            c=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "Test") | .conclusion')
            echo "esecuzione $id, job Test: ${c:-in corso o assente}"
            if [ "$c" = "success" ]; then ok=1; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::test non verdi per l'ultimo commit di codice ${sha:0:7}: pubblicazione fermata (online resta la versione precedente)"
            exit 1
          fi
          echo "test verdi per ${sha:0:7}: si pubblica"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - name: Prezzi indicativi (non committati, cambiano ogni giorno)
        run: |
          pip install -r pipeline/requirements-lock.txt -e pipeline
          # senza prezzi il sito funziona lo stesso (mostra "—"): un errore qui non blocca la pubblicazione
          python -m pauper_index prices || echo "::warning::prezzi non generati: il sito mostra '—'"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build del sito
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    name: Avviso di errore
    needs: [test, update, deploy]
    if: ${{ failure() && github.event_name != 'pull_request' }}   # sulle PR l'esito è già nei controlli
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apri una Issue (arriva un'email al proprietario del repository)
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --repo "${{ github.repository }}" \
            --title "Esecuzione fallita: ${{ github.workflow }} del $(date -u +%F)" \
            --assignee "${{ github.repository_owner }}" \
            --body "L'esecuzione $url (evento: ${{ github.event_name }}) è fallita. Apri il link per vedere quale passaggio non è andato a buon fine."
